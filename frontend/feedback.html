<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback - T.B. Jayah Zahira College</title>
<style>
  :root{--bg:#050505;--text:#f5f2e1;--gold:#ffd700;--muted:#b5a77d;--surface:rgba(255,255,255,0.05);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:Georgia, 'Times New Roman', serif;background:#050505;color:var(--text);}
  .page{max-width:1140px;margin:0 auto;padding:32px 24px 80px;}
  .page-title{font-size:3.2rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:24px;text-align:center;}
  .image-panel{overflow:hidden;border-radius:24px;box-shadow:0 28px 70px rgba(0,0,0,0.32);margin-bottom:32px;}
  .image-panel img{width:100%;height:auto;display:block;object-fit:cover;}
  .form-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:28px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,0.28);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  .field-row label{display:block;font-size:0.9rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .field-row input{width:100%;padding:16px 18px;border-radius:16px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.45);color:#fff;font-size:1rem;}
  .field-row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,215,0,0.10);}
  .textarea-group{margin-bottom:20px;}
  .textarea-group label{display:block;font-size:0.9rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  textarea{width:100%;min-height:260px;padding:18px 20px;border-radius:20px;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.45);color:#fff;font-size:1rem;resize:vertical;line-height:1.7;}
  .info-bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;color:var(--muted);font-size:0.95rem;}
  .submit-button{width:100%;padding:18px 22px;border:none;border-radius:999px;background:var(--gold);color:#050505;font-weight:900;font-size:1rem;letter-spacing:0.14em;cursor:pointer;transition:transform 0.2s ease,filter 0.2s ease;}
  .submit-button:hover{transform:translateY(-2px);filter:brightness(1.05);}
  .status-message{margin-top:22px;padding:18px 20px;border-radius:20px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,215,0,0.18);color:#fff;white-space:pre-wrap;line-height:1.6;}
  .error{color:#ffb3b3;border-color:#ff7a7a;background:rgba(255,120,120,0.12);}
  .success{color:#d5ffb3;border-color:#baff7a;background:rgba(180,255,120,0.12);}
  .footer{margin-top:42px;padding-top:32px;border-top:1px solid rgba(255,215,0,0.10);text-align:center;color:var(--muted);font-size:0.85rem;letter-spacing:0.08em;}
  @media(max-width:860px){.field-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <div class="page">
    <div class="page-title">Feedback</div>
    <div class="image-panel">
      <img src="../images/feedback.jpg" alt="Feedback" loading="lazy">
    </div>
    <div class="form-card">
      <form id="feedbackForm">
        <div class="field-row">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="textarea-group">
          <label for="message">Write your name above the text box and enter your feedback message below (700 words max)</label>
          <textarea id="message" name="message" placeholder="Type your feedback here..." required></textarea>
        </div>
        <div class="info-bar">
          <span id="wordCount">0 / 700 words</span>
          <span>Feedback is automatically saved with your name, email, and timestamp.</span>
        </div>
        <button type="submit" class="submit-button">Submit Feedback</button>
      </form>
      <div id="status" class="status-message" style="display:none;"></div>
    </div>
    <div class="footer">Thank you for sharing your thoughts with T.B. Jayah Zahira College.</div>
  </div>
<script>
const form = document.getElementById('feedbackForm');
const messageEl = document.getElementById('message');
const emailEl = document.getElementById('email');
const nameEl = document.getElementById('name');
const statusEl = document.getElementById('status');
const wordCountEl = document.getElementById('wordCount');
const sentence100 = 'Thank you for submitting the feedback from tbjzc2013@gmail.com to the email address you provided, and please know that every idea, concern, encouragement, or suggestion you share here will be read carefully, handled respectfully, recorded accurately, and used to improve the website experience for our students, parents, teachers, and visitors, while we continue to build a stronger, more helpful, and more welcoming college community for everyone who relies on this school communication channel with care, clarity, and honesty in every follow-up step that makes this connection truly useful and meaningful for the school family.';

function countWords(text) {
  return text.trim().split(/\s+/).filter(Boolean).length;
}

messageEl.addEventListener('input', () => {
  const count = countWords(messageEl.value);
  wordCountEl.textContent = `${count} / 700 words`;
  if (count > 700) {
    wordCountEl.style.color = '#ff8080';
  } else {
    wordCountEl.style.color = '#b5a77d';
  }
});

function validateEmail(email) {
  return /^\S+@\S+\.\S+$/.test(email);
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const name = nameEl.value.trim();
  const email = emailEl.value.trim();
  const message = messageEl.value.trim();
  const wordCount = countWords(message);

  if (!name || !email || !message) {
    statusEl.textContent = 'All fields are required. Please complete the form before submitting.';
    statusEl.className = 'status-message error';
    statusEl.style.display = 'block';
    return;
  }
  if (!validateEmail(email)) {
    statusEl.textContent = 'Please provide a valid email address.';
    statusEl.className = 'status-message error';
    statusEl.style.display = 'block';
    return;
  }
  if (wordCount > 700) {
    statusEl.textContent = 'Your message exceeds the 700-word limit. Please shorten it and try again.';
    statusEl.className = 'status-message error';
    statusEl.style.display = 'block';
    return;
  }

  statusEl.textContent = 'Submitting your feedback...';
  statusEl.className = 'status-message';
  statusEl.style.display = 'block';

  try {
    const response = await fetch('/submit-feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, message })
    });

    let data;
    const text = await response.text();
    try {
      data = JSON.parse(text);
    } catch (jsonError) {
      throw new Error(text || 'Invalid server response received.');
    }

    if (!response.ok) throw new Error(data.error || 'Unable to submit feedback.');

    statusEl.textContent = data.message || 'Feedback saved successfully.';
    statusEl.className = 'status-message success';
    statusEl.style.display = 'block';
    form.reset();
    wordCountEl.textContent = '0 / 700 words';
  } catch (error) {
    statusEl.textContent = error.message;
    statusEl.className = 'status-message error';
    statusEl.style.display = 'block';
  }
});
</script>
</body>
</html>
